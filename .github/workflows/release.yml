# Release trigger: Home redesign 2026-08-20
name: Build & Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Compute version
        id: ver
        run: |
          VC=$(git rev-list --count HEAD)
          VN="1.0.$VC"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Test release updater
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Build release APK with private signing key
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          SIGNING_KEYSTORE_B64: ${{ secrets.HOME_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.HOME_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.HOME_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.HOME_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$SIGNING_KEYSTORE_B64" "$ANDROID_SIGNING_STORE_PASSWORD" "$ANDROID_SIGNING_KEY_ALIAS" "$ANDROID_SIGNING_KEY_PASSWORD"; do
            test -n "$value" || { echo "::error::Missing private signing secret; refusing to publish an APK"; exit 1; }
          done
          export ANDROID_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/home-private-signing.jks"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$ANDROID_SIGNING_KEYSTORE_PATH"
          chmod 600 "$ANDROID_SIGNING_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_SIGNING_KEYSTORE_PATH"' EXIT
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/Home-${{ steps.ver.outputs.name }}.apk"
          (cd out && sha256sum "Home-${{ steps.ver.outputs.name }}.apk" > "Home-${{ steps.ver.outputs.name }}.apk.sha256")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: Home ${{ steps.ver.outputs.name }} (v${{ steps.ver.outputs.code }})
          body: |
            自動ビルドされた Home ランチャーの APK です。
            端末にこの APK をインストールしてください。以降は
            アプリ内で自動的に更新を確認します。
          files: |
            out/Home-${{ steps.ver.outputs.name }}.apk
            out/Home-${{ steps.ver.outputs.name }}.apk.sha256
          fail_on_unmatched_files: true

      # Private-source compatible: optionally mirror the signed APK to a separate
      # PUBLIC downloads-only repository. Never embed repository credentials in APK.
      # Set the source repo variable HOME_DISTRIBUTION_REPO=masakasakasama/Home-Downloads
      # and fine-grained source repo secret HOME_DISTRIBUTION_TOKEN (contents:write
      # restricted to Home-Downloads). Bridge releases use legacy signing.
      - name: Publish to public APK distribution repo
        if: ${{ vars.HOME_DISTRIBUTION_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOME_DISTRIBUTION_TOKEN }}
          TARGET: ${{ vars.HOME_DISTRIBUTION_REPO }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          test "$TARGET" = "masakasakasama/Home-Downloads" || {
            echo "::error::Unexpected distribution repository"; exit 1;
          }
          test -n "$GH_TOKEN" || {
            echo "::error::HOME_DISTRIBUTION_TOKEN is not configured"; exit 1;
          }
          visibility=$(gh repo view "$TARGET" --json visibility -q .visibility)
          test "$visibility" = "PUBLIC" || {
            echo "::error::Distribution repository must be public"; exit 1;
          }
          tag="v$VERSION_CODE"
          apk="out/Home-$VERSION_NAME.apk"
          if gh release view "$tag" --repo "$TARGET" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$apk.sha256" --repo "$TARGET" --clobber
          else
            gh release create "$tag" "$apk" "$apk.sha256" --repo "$TARGET" \
              --title "Home $VERSION_NAME" --notes "Home Android APK (public distribution only; source is private)"
          fi
